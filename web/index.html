<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpendLock - Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes sg-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sg-modal-in { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
      @keyframes sg-modal-out { to { opacity: 0; transform: translateY(-24px); } }
      @keyframes sg-pop { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
      @keyframes sg-ring { from { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.45); } to { box-shadow: 0 0 0 22px rgba(76, 175, 80, 0); } }
      @keyframes sg-draw { to { stroke-dashoffset: 0; } }
      .sg-backdrop-in { animation: sg-fade-in 0.18s ease-out; }
      .sg-modal-in { animation: sg-modal-in 0.22s ease-out; }
      .sg-modal-out { animation: sg-modal-out 0.22s ease-in forwards; }
      .sg-approve-circle { animation: sg-pop 0.35s ease-out, sg-ring 0.9s ease-out 0.15s; }
      .sg-check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: sg-draw 0.3s ease-out 0.25s forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
